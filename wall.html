<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expo Wall Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /*
    Fixed 1920x1080 stage, scaled to fit whatever window or ProPresenter
    web object it lands in.

    Layout: QR rail | one post in the spotlight | two slowly drifting columns
    of everything else. New approved posts jump straight into the spotlight.

    URL options:
      ?clear=1   transparent background (use ProPresenter's own background)
      ?fs=0      hide the full-screen icon entirely
    Full screen: click the faint icon in the top-right corner,
    double-click anywhere, or press F.
  */
  :root {
    --base: #181716;
    --rail: #121110;
    --spot: #211e1c;
    --edge: #4a4540;
    --card: #ffffff;
    --accent: #d49c61;
    --ink: #181716;
    --steel: #6b645c;
    --steel-light: #b3aca4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--base);
    cursor: none;
  }
  body.clear, body.clear #stage, body.clear .rail { background: transparent !important; }

  #stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1920px;
    height: 1080px;
    transform-origin: center center;
    display: grid;
    grid-template-columns: 480px 1fr;
    font-family: Barlow, "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background-color: var(--base);
    background-image:
      linear-gradient(rgba(212,156,97,.13) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,156,97,.13) 1px, transparent 1px),
      linear-gradient(rgba(212,156,97,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,156,97,.05) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  }

  /* ── Left rail ─────────────────────────────────────── */
  .rail {
    background: var(--rail);
    border-right: 2px solid rgba(212,156,97,.35);
    padding: 64px 52px 52px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .logo { display: block; align-self: flex-start; max-width: 100%; max-height: 120px; width: auto; height: auto; object-fit: contain; margin: 0; }
  .event { margin: 0; font-size: 24px; line-height: 1.35; color: var(--steel-light); font-weight: 500; }
  .title {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 88px;
    line-height: .9;
    margin: 28px 0 0;
    letter-spacing: -.5px;
  }
  .prompt { font-size: 34px; font-weight: 600; line-height: 1.2; margin: 24px 0 0; }
  .scan {
    margin-top: auto;
    background: var(--accent);
    color: var(--ink);
    border-radius: 8px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  #qr { flex: none; width: 224px; height: 224px; background: #fff; padding: 12px; border-radius: 4px; }
  #qr img, #qr canvas { width: 200px !important; height: 200px !important; display: block; }
  .scan-head {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 48px;
    line-height: .92;
    margin: 0 0 8px;
  }
  .scan-url { font-size: 20px; font-weight: 600; line-height: 1.3; margin: 0; overflow-wrap: anywhere; }

  /* ── Main area: spotlight + two drifting columns ─────── */
  .main {
    padding: 48px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 248px 248px;
    column-gap: 28px;
    min-height: 0;
  }

  /* Spotlight */
  .spotlight { position: relative; min-height: 0; }
  .spot {
    position: absolute;
    inset: 0;
    background: var(--spot);
    border: 1px solid rgba(212,156,97,.28);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1);
  }
  .spot.entering { opacity: 0; transform: translateY(24px); }
  .spot.leaving { opacity: 0; transform: scale(.98); }

  .spot-text { padding: 56px 64px 60px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .spot-body { margin: auto 0; min-height: 0; }
  .quote-mark {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 220px;
    line-height: .62;
    height: 110px;
    color: var(--accent);
    margin: 0 0 18px -8px;
    user-select: none;
  }
  .spot .msg {
    margin: 0;
    font-weight: 600;
    white-space: pre-wrap;
    word-break: break-word;
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
  }
  .spot-text .msg.s1 { font-size: 72px; line-height: 1.12; -webkit-line-clamp: 6; }
  .spot-text .msg.s2 { font-size: 58px; line-height: 1.16; -webkit-line-clamp: 8; }
  .spot-text .msg.s3 { font-size: 46px; line-height: 1.2;  -webkit-line-clamp: 10; }

  .spot .by {
    margin: 0;
    padding-top: 28px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-size: 38px;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .spot .by strong { font-weight: 700; color: var(--accent); }
  .spot .by span { font-weight: 600; color: var(--steel-light); }

  .spot-photo { position: relative; flex: 1; min-height: 0; background: #0d0c0b; overflow: hidden; }
  .spot-photo img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .spot-photo img.bg { object-fit: cover; filter: blur(28px) brightness(.5); transform: scale(1.15); }
  .spot-photo img.fg { object-fit: contain; animation: drift var(--dwell, 10s) linear both; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.045); } }
  .spot-cap { padding: 26px 40px 34px; }
  .spot-cap .msg { font-size: 36px; line-height: 1.22; -webkit-line-clamp: 3; }
  .spot-cap .by { padding-top: 12px; font-size: 32px; margin: 0; }

  .just-posted {
    position: absolute;
    top: 24px;
    right: 24px;
    z-index: 2;
    background: var(--accent);
    color: var(--ink);
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1;
    padding: 10px 18px 11px;
    border-radius: 6px;
  }
  .progress {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 5px;
    width: 100%;
    background: var(--accent);
    transform-origin: left center;
    animation: fill var(--dwell, 10s) linear both;
    opacity: .85;
  }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .spot-empty { padding: 72px 64px; justify-content: center; }
  .spot-empty h2 {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-size: 120px;
    line-height: .92;
    margin: 0 0 28px;
  }
  .spot-empty p { font-size: 42px; line-height: 1.25; margin: 0; color: var(--steel-light); max-width: 18ch; }

  /* Drifting columns */
  .col {
    position: relative;
    overflow: hidden;
    min-height: 0;
    transition: opacity .45s ease;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 70px, #000 calc(100% - 70px), transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 70px, #000 calc(100% - 70px), transparent 100%);
  }
  .col.refresh { opacity: 0; }
  .track { display: flow-root; will-change: transform; }
  @keyframes scrollUp   { from { transform: translateY(0); }    to { transform: translateY(-50%); } }
  @keyframes scrollDown { from { transform: translateY(-50%); } to { transform: translateY(0); } }

  .mini {
    background: var(--card);
    color: var(--ink);
    border-radius: 8px;
    border-left: 6px solid var(--edge);
    margin: 0 0 20px;
    overflow: hidden;
  }
  .mini-text { padding: 18px 18px 16px; }
  .mini .msg {
    margin: 0;
    font-size: 21px;
    line-height: 1.3;
    font-weight: 500;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .mini .by {
    margin: 12px 0 0;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-size: 20px;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mini .by strong { font-weight: 700; color: var(--ink); }
  .mini .by span { font-weight: 600; color: var(--steel); }
  .mini-photo { position: relative; height: 230px; background: #0d0c0b; overflow: hidden; }
  .mini-photo img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mini-photo img.bg { object-fit: cover; filter: blur(16px) brightness(.55); transform: scale(1.15); }
  .mini-photo img.fg { object-fit: contain; }
  .mini.photo { border-left: 0; }
  .mini.photo .msg { font-size: 19px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }

  /* Until there are enough posts to drift, columns show as quiet outlines */
  .col-empty {
    position: absolute;
    inset: 0;
    border: 2px dashed rgba(179,172,164,.22);
    border-radius: 8px;
    display: none;
  }
  #stage.sparse .col-empty { display: block; }
  #stage.sparse .track { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .spot, .col { transition: none; }
    .spot-photo img.fg, .progress { animation: none; }
    .track { animation: none !important; }
  }

  /* Full-screen control: small, faint icon in the corner.
     Brightens when the mouse moves, full strength on hover. */
  body.awake { cursor: default; }
  .fs-btn {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 10;
    width: 34px;
    height: 34px;
    padding: 7px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #fff;
    cursor: pointer;
    opacity: .12;
    transition: opacity .3s, background-color .3s;
  }
  .fs-btn svg { display: block; width: 20px; height: 20px; }
  body.awake .fs-btn { opacity: .45; }
  .fs-btn:hover, .fs-btn:focus-visible { opacity: 1; background: rgba(255,255,255,.12); }
  .fs-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .fs-btn .i-exit { display: none; }
  .fs-btn.is-full .i-enter { display: none; }
  .fs-btn.is-full .i-exit { display: block; }

  .status {
    position: absolute;
    right: 56px;
    bottom: 14px;
    font-size: 18px;
    color: var(--steel-light);
    opacity: 0;
    transition: opacity .4s;
  }
  .status.show { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <aside class="rail">
    <img class="logo" id="logo" alt="" hidden>
    <p class="event" id="event"></p>
    <h1 class="title" id="title">The Expo Wall</h1>
    <p class="prompt" id="prompt"></p>
    <div class="scan">
      <div id="qr" aria-hidden="true"></div>
      <div>
        <p class="scan-head">Scan to post</p>
        <p class="scan-url" id="url"></p>
      </div>
    </div>
  </aside>
  <section class="main">
    <div class="spotlight" id="spotlight" aria-live="polite"></div>
    <div class="col" id="col0"><div class="track"></div><div class="col-empty"></div></div>
    <div class="col" id="col1"><div class="track"></div><div class="col-empty"></div></div>
  </section>
  <div class="status" id="status">Reconnecting…</div>
</div>
<button type="button" class="fs-btn" id="fsBtn" aria-label="Full screen" title="Full screen (F)">
  <svg class="i-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  <svg class="i-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig, EVENT } from "./config.js";

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  if (params.get("clear") === "1") document.body.classList.add("clear");

  // ── Stage scaling ─────────────────────────────────────
  const stage = $("stage");
  function fit() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  window.addEventListener("resize", fit);
  fit();

  // ── Full screen ───────────────────────────────────────
  const fsBtn = $("fsBtn");
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const fsSupported = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  function toggleFullscreen() {
    if (fsEl()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
  }
  function syncFsLabel() {
    const full = !!fsEl();
    fsBtn.classList.toggle("is-full", full);
    fsBtn.setAttribute("aria-label", full ? "Exit full screen" : "Full screen");
    fsBtn.title = full ? "Exit full screen (F)" : "Full screen (F)";
  }
  if (params.get("fs") === "0") fsBtn.remove();
  if (fsSupported) {
    fsBtn.addEventListener("click", toggleFullscreen);
    document.addEventListener("dblclick", toggleFullscreen);
    document.addEventListener("keydown", (e) => {
      if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey) toggleFullscreen();
    });
    document.addEventListener("fullscreenchange", syncFsLabel);
    document.addEventListener("webkitfullscreenchange", syncFsLabel);
  } else if (fsBtn.isConnected) {
    fsBtn.remove();
  }
  let idleTimer;
  function wake() {
    document.body.classList.add("awake");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.remove("awake"), 3000);
  }
  document.addEventListener("mousemove", wake);
  document.addEventListener("touchstart", wake, { passive: true });
  wake();

  // ── Rail copy, logo, QR ───────────────────────────────
  [EVENT.eventLine1, EVENT.eventLine2].forEach((line, i) => {
    if (i) $("event").appendChild(document.createElement("br"));
    $("event").appendChild(document.createTextNode(line));
  });
  $("title").textContent = EVENT.wallTitle;
  $("prompt").textContent = EVENT.prompt;
  if (EVENT.logo) {
    const logo = $("logo");
    logo.alt = EVENT.eventLine1;
    logo.onload = () => { logo.hidden = false; $("event").hidden = true; };
    logo.src = encodeURI(EVENT.logo);
  }
  const postUrl = EVENT.postUrl || new URL("./", location.href).href;
  $("url").textContent = postUrl.replace(/^https?:\/\//, "").replace(/\/$/, "");
  if (window.QRCode) {
    new QRCode($("qr"), {
      text: postUrl, width: 400, height: 400,
      colorDark: "#181716", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  // ── Settings ──────────────────────────────────────────
  const POOL = Math.max(1, EVENT.wallPool || 60);
  const DWELL = Math.max(4, EVENT.spotlightSeconds || 10) * 1000;
  const SPEED = Math.max(5, EVENT.driftSpeed || 22);         // px per second
  const MIN_FOR_COLUMNS = Math.max(2, EVENT.minPostsForColumns || 4);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  stage.style.setProperty("--dwell", `${DWELL / 1000}s`);

  // ── Shared helpers ────────────────────────────────────
  const hasPhoto = (p) => typeof p.image === "string" && p.image.startsWith("data:image/jpeg;base64,");

  // Photos arrive as long data URLs. Convert each once to a blob URL so the
  // same photo can appear in the spotlight and columns without copying it.
  const blobUrls = new Map();
  function photoUrl(p) {
    let url = blobUrls.get(p.id);
    if (!url) {
      const bin = atob(p.image.slice(p.image.indexOf(",") + 1));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      url = URL.createObjectURL(new Blob([bytes], { type: "image/jpeg" }));
      blobUrls.set(p.id, url);
    }
    return url;
  }
  function releaseBlobs(liveIds) {
    for (const [id, url] of blobUrls) {
      if (!liveIds.has(id)) { URL.revokeObjectURL(url); blobUrls.delete(id); }
    }
  }

  function byline(post) {
    const by = document.createElement("p");
    by.className = "by";
    const name = (post.name || "").trim();
    const org = (post.org || "").trim();
    if (name) {
      const strong = document.createElement("strong");
      strong.textContent = name;
      by.appendChild(strong);
    }
    if (org || !name) {
      const span = document.createElement("span");
      span.textContent = org ? (name ? ", " : "") + org : "Expo attendee";
      by.appendChild(span);
    }
    return by;
  }

  function photoBox(className, url) {
    const box = document.createElement("div");
    box.className = className;
    const bg = document.createElement("img");
    bg.className = "bg"; bg.src = url; bg.alt = "";
    const fg = document.createElement("img");
    fg.className = "fg"; fg.src = url; fg.alt = "";
    box.append(bg, fg);
    return box;
  }

  function msgEl(text, className) {
    const p = document.createElement("p");
    p.className = className ? `msg ${className}` : "msg";
    p.textContent = text;
    return p;
  }

  function spotSize(text) {
    const n = (text || "").length;
    return n <= 60 ? "s1" : n <= 120 ? "s2" : "s3";
  }

  // ── State ─────────────────────────────────────────────
  let all = [];            // approved posts, newest first
  let byId = new Map();
  let known = null;        // ids from the previous snapshot; null before first load
  let queue = [];          // newly approved ids waiting for the spotlight
  let spotId = null;
  let spotTimer = null;
  let spotIsNew = false;
  let spotShownAt = 0;
  const spotSeen = new Map(); // id -> last time it was in the spotlight

  // ── Spotlight ─────────────────────────────────────────
  const spotBox = $("spotlight");

  function buildSpot(post, isNew) {
    const el = document.createElement("article");
    el.className = "spot";

    if (!post) {
      el.classList.add("spot-empty");
      const h = document.createElement("h2");
      h.textContent = "Be the first on the wall.";
      const p = document.createElement("p");
      p.textContent = "Scan the code to post a highlight, a photo, or a takeaway.";
      el.append(h, p);
      return el;
    }

    if (hasPhoto(post)) {
      el.appendChild(photoBox("spot-photo", photoUrl(post)));
      const cap = document.createElement("div");
      cap.className = "spot-cap";
      if (post.message) cap.appendChild(msgEl(post.message));
      cap.appendChild(byline(post));
      el.appendChild(cap);
    } else {
      const body = document.createElement("div");
      body.className = "spot-text";
      const mark = document.createElement("div");
      mark.className = "quote-mark";
      mark.setAttribute("aria-hidden", "true");
      mark.textContent = "\u201C";
      const group = document.createElement("div");
      group.className = "spot-body";
      group.append(mark, msgEl(post.message || "", spotSize(post.message)));
      body.append(group, byline(post));
      el.appendChild(body);
    }

    if (isNew) {
      const tag = document.createElement("div");
      tag.className = "just-posted";
      tag.textContent = "Just posted";
      el.appendChild(tag);
    }
    if (all.length > 1) {
      const bar = document.createElement("div");
      bar.className = "progress";
      el.appendChild(bar);
    }
    return el;
  }

  function showSpot(post, isNew = false) {
    const el = buildSpot(post, isNew);
    const old = [...spotBox.children];
    if (!reduceMotion) el.classList.add("entering");
    spotBox.appendChild(el);
    if (!reduceMotion) {
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("entering")));
      old.forEach((o) => { o.classList.add("leaving"); setTimeout(() => o.remove(), 750); });
    } else {
      old.forEach((o) => o.remove());
    }

    spotId = post ? post.id : null;
    spotIsNew = !!(post && isNew);
    spotShownAt = Date.now();
    if (post) spotSeen.set(post.id, spotShownAt);
    clearTimeout(spotTimer);
    if (post) spotTimer = setTimeout(nextSpot, DWELL);
  }

  // Next spotlight: newly approved posts first, then whichever posts have
  // gone longest without a turn (with a little randomness)
  function nextSpot() {
    clearTimeout(spotTimer);
    spotTimer = null;
    if (!all.length) { if (spotId !== null || !spotBox.children.length) showSpot(null); return; }

    while (queue.length) {
      const p = byId.get(queue.shift());
      if (p) { showSpot(p, true); return; }
    }

    if (all.length === 1) {
      if (spotId !== all[0].id) showSpot(all[0]);
      return; // nothing else to rotate to
    }

    const candidates = all
      .filter((p) => p.id !== spotId)
      .sort((a, b) => (spotSeen.get(a.id) || 0) - (spotSeen.get(b.id) || 0));
    const pool = candidates.slice(0, Math.max(1, Math.ceil(candidates.length / 3)));
    showSpot(pool[Math.floor(Math.random() * pool.length)]);
  }

  // ── Drifting columns ──────────────────────────────────
  const cols = [$("col0"), $("col1")];
  let columnKey = "";

  function buildMini(post) {
    const card = document.createElement("article");
    card.className = "mini";
    if (hasPhoto(post)) {
      card.classList.add("photo");
      card.appendChild(photoBox("mini-photo", photoUrl(post)));
    }
    const text = document.createElement("div");
    text.className = "mini-text";
    if (post.message) text.appendChild(msgEl(post.message));
    text.appendChild(byline(post));
    card.appendChild(text);
    return card;
  }

  function fillTrack(col, posts, index) {
    const track = col.querySelector(".track");
    track.style.animation = "none";
    track.innerHTML = "";
    if (!posts.length) return;

    // Repeat the set until it's taller than the column, then duplicate it
    // once so the loop is seamless (the animation moves exactly one set).
    const colH = col.offsetHeight;
    let guard = 0;
    do {
      posts.forEach((p) => track.appendChild(buildMini(p)));
      guard++;
    } while (track.offsetHeight < colH && guard < 10);
    const setH = track.offsetHeight;
    [...track.children].forEach((c) => track.appendChild(c.cloneNode(true)));

    if (reduceMotion) return;
    const seconds = setH / (SPEED * (index ? 0.8 : 1)); // slightly different speeds
    const name = index ? "scrollDown" : "scrollUp";       // opposite directions
    // Start partway through so the two columns don't line up
    const offset = -(seconds * (index ? 0.35 : 0.1));
    track.style.animation = `${name} ${seconds}s linear ${offset}s infinite`;
  }

  function buildColumns() {
    const key = all.map((p) => p.id).join("|");
    if (key === columnKey) return;
    columnKey = key;

    const sparse = all.length < MIN_FOR_COLUMNS;
    stage.classList.toggle("sparse", sparse);
    if (sparse) { cols.forEach((c) => (c.querySelector(".track").innerHTML = "")); return; }

    const split = [[], []];
    all.forEach((p, i) => split[i % 2].push(p));
    cols.forEach((col, i) => {
      const build = () => { fillTrack(col, split[i], i); col.classList.remove("refresh"); };
      if (!col.dataset.built || reduceMotion) { build(); col.dataset.built = "1"; }
      else { col.classList.add("refresh"); setTimeout(build, 450); }
    });
  }

  // ── Data ──────────────────────────────────────────────
  function applySnapshot(posts) {
    const liveIds = new Set(posts.map((p) => p.id));
    const arrivals = known === null ? [] : posts.filter((p) => !known.has(p.id)).map((p) => p.id).reverse();
    all = posts;
    byId = new Map(posts.map((p) => [p.id, p]));

    buildColumns();

    if (known === null) {
      showSpot(posts[0] || null); // start with the newest
    } else if (arrivals.length) {
      queue.push(...arrivals);    // oldest arrival first
      // New posts interrupt the rotation, but never cut another brand-new
      // post short: if one is still in its first half, the next one waits.
      const protectedNew = spotIsNew && Date.now() - spotShownAt < DWELL / 2;
      if (!protectedNew) nextSpot();
    } else if (!posts.length) {
      showSpot(null);
    } else if (!spotId || !liveIds.has(spotId)) {
      nextSpot();                 // spotlight post was removed
    } else if (posts.length > 1 && !spotTimer) {
      spotTimer = setTimeout(nextSpot, DWELL);
    }

    known = liveIds;
    releaseBlobs(liveIds);
  }

  const status = $("status");
  const db = getFirestore(initializeApp(firebaseConfig));
  const wallQuery = query(collection(db, "wall"), orderBy("approvedAt", "desc"), limit(POOL));
  const fontsReady = document.fonts ? document.fonts.ready.catch(() => {}) : Promise.resolve();

  function subscribe() {
    onSnapshot(wallQuery, (snap) => {
      status.classList.remove("show");
      const posts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      fontsReady.then(() => applySnapshot(posts)); // measure columns with real fonts
    }, (err) => {
      console.error(err);
      status.classList.add("show");
      setTimeout(subscribe, 5000); // listener stops on error; try again
    });
  }
  subscribe();
</script>
</body>
</html>
