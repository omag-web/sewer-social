<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expo Wall Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /*
    Fixed 1920x1080 stage, scaled to fit whatever window or ProPresenter
    web object it lands in, so it looks identical at any size.
    URL options:
      ?clear=1   transparent background (use ProPresenter's own background)
    Full screen: click the button (appears when you move the mouse),
    double-click anywhere, or press F.
  */
  :root {
    --base: #181716;
    --rail: #121110;
    --edge: #4a4540;
    --card: #ffffff;
    --accent: #d49c61;
    --ink: #181716;
    --steel: #6b645c;
    --steel-light: #b3aca4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--base);
    cursor: none;
  }
  body.clear, body.clear #stage, body.clear .rail { background: transparent !important; }

  #stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1920px;
    height: 1080px;
    transform-origin: center center;
    display: grid;
    grid-template-columns: 520px 1fr;
    font-family: Barlow, "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background-color: var(--base);
    background-image:
      linear-gradient(rgba(212,156,97,.13) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,156,97,.13) 1px, transparent 1px),
      linear-gradient(rgba(212,156,97,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,156,97,.05) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  }

  /* Left rail */
  .rail {
    background: var(--rail);
    border-right: 2px solid rgba(212,156,97,.35);
    padding: 64px 56px 56px;
    display: flex;
    flex-direction: column;
  }
  .logo { display: block; max-width: 100%; max-height: 120px; width: auto; height: auto; margin: 0; }
  .event { margin: 0; font-size: 24px; line-height: 1.35; color: var(--steel-light); font-weight: 500; }
  .title {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 88px;
    line-height: .9;
    margin: 28px 0 0;
    letter-spacing: -.5px;
  }
  .prompt {
    font-size: 36px;
    font-weight: 600;
    line-height: 1.2;
    margin: 28px 0 0;
    color: #fff;
  }
  .scan {
    margin-top: auto;
    background: var(--accent);
    color: var(--ink);
    border-radius: 8px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  #qr {
    flex: none;
    width: 224px;
    height: 224px;
    background: #fff;
    padding: 12px;
    border-radius: 4px;
  }
  #qr img, #qr canvas { width: 200px !important; height: 200px !important; display: block; }
  .scan-text { min-width: 0; }
  .scan-head {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 48px;
    line-height: .92;
    margin: 0 0 8px;
  }
  .scan-url { font-size: 18px; font-weight: 600; line-height: 1.3; margin: 0; overflow-wrap: anywhere; }

  /* Posts grid */
  .posts {
    padding: 56px 56px 56px 48px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 24px;
    min-height: 0;
  }
  .slot {
    border: 2px dashed rgba(179,172,164,.22);
    border-radius: 8px;
  }
  .card {
    background: var(--card);
    color: var(--ink);
    border-radius: 8px;
    border-left: 8px solid var(--edge);
    padding: 24px 26px 22px 26px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .card.latest { border-left: 14px solid var(--accent); padding-left: 22px; }
  .msg {
    margin: 0;
    font-weight: 500;
    white-space: pre-wrap;
    word-break: break-word;
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
  }
  .msg.s1 { font-size: 36px; line-height: 1.2;  -webkit-line-clamp: 5; }
  .msg.s2 { font-size: 29px; line-height: 1.22; -webkit-line-clamp: 6; }
  .msg.s3 { font-size: 24px; line-height: 1.25; -webkit-line-clamp: 8; }
  .by {
    margin: auto 0 0;
    padding-top: 14px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-size: 25px;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .by strong { font-weight: 700; color: var(--ink); }
  .by span { font-weight: 600; color: var(--steel); }

  /* Photo posts: image fills the card, caption over a dark fade */
  .card.photo {
    position: relative;
    padding: 0;
    background: var(--base);
    justify-content: flex-end;
  }
  .card.photo.latest { padding-left: 0; }
  .card.photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card.photo .cap {
    position: relative;
    padding: 60px 22px 18px;
    background: linear-gradient(to top, rgba(24,23,22,.92) 0%, rgba(24,23,22,.75) 55%, rgba(24,23,22,0) 100%);
    color: #fff;
  }
  .card.photo .msg { font-size: 23px; line-height: 1.25; -webkit-line-clamp: 3; }
  .card.photo .by { padding-top: 8px; font-size: 22px; }
  .card.photo .by strong { color: #fff; }
  .card.photo .by span { color: #d8d2cb; }

  .card.enter { animation: arrive 900ms cubic-bezier(.2,.8,.2,1) both; }
  @keyframes arrive {
    0%   { opacity: 0; transform: scale(.94); box-shadow: 0 0 0 0 rgba(212,156,97,0); }
    55%  { opacity: 1; transform: scale(1.02); box-shadow: 0 0 0 10px rgba(212,156,97,.55); }
    100% { opacity: 1; transform: scale(1);   box-shadow: 0 0 0 0 rgba(212,156,97,0); }
  }
  @media (prefers-reduced-motion: reduce) { .card.enter { animation: none; } }

  .empty {
    grid-column: 1 / -1;
    grid-row: 1 / -1;
    border: 2px dashed rgba(179,172,164,.35);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 120px;
  }
  .empty h2 {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-size: 110px;
    line-height: .95;
    margin: 0 0 24px;
  }
  .empty p { font-size: 40px; line-height: 1.25; margin: 0; color: var(--steel-light); max-width: 20ch; }

  /* Full-screen control: shows on mouse movement, hides when idle */
  body.awake { cursor: default; }
  .fs-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 20px;
    padding: 10px 18px;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: var(--ink);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  body.awake .fs-btn { opacity: 1; pointer-events: auto; }
  .fs-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; opacity: 1; pointer-events: auto; }

  .status {
    position: absolute;
    right: 56px;
    bottom: 18px;
    font-size: 18px;
    color: var(--steel-light);
    opacity: 0;
    transition: opacity .4s;
  }
  .status.show { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <aside class="rail">
    <img class="logo" id="logo" alt="" hidden>
    <p class="event" id="event"></p>
    <h1 class="title" id="title">The Expo Wall</h1>
    <p class="prompt" id="prompt"></p>
    <div class="scan">
      <div id="qr" aria-hidden="true"></div>
      <div class="scan-text">
        <p class="scan-head">Scan to post</p>
        <p class="scan-url" id="url"></p>
      </div>
    </div>
  </aside>
  <section class="posts" id="posts" aria-live="polite"></section>
  <div class="status" id="status">Reconnecting…</div>
</div>
<button type="button" class="fs-btn" id="fsBtn">Full screen</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig, EVENT } from "./config.js";

  const params = new URLSearchParams(location.search);
  if (params.get("clear") === "1") document.body.classList.add("clear");

  // Scale the fixed stage to fit the viewport
  const stage = document.getElementById("stage");
  function fit() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  window.addEventListener("resize", fit);
  fit();

  // Full screen
  const fsBtn = document.getElementById("fsBtn");
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const fsSupported = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  function toggleFullscreen() {
    if (fsEl()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
  }
  function syncFsLabel() { fsBtn.textContent = fsEl() ? "Exit full screen" : "Full screen"; }
  if (fsSupported) {
    fsBtn.addEventListener("click", toggleFullscreen);
    document.addEventListener("dblclick", toggleFullscreen);
    document.addEventListener("keydown", (e) => {
      if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey) toggleFullscreen();
    });
    document.addEventListener("fullscreenchange", syncFsLabel);
    document.addEventListener("webkitfullscreenchange", syncFsLabel);
  } else {
    fsBtn.remove();
  }

  // Show cursor + button on mouse movement; hide after 3s idle
  let idleTimer;
  function wake() {
    document.body.classList.add("awake");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.remove("awake"), 3000);
  }
  document.addEventListener("mousemove", wake);
  document.addEventListener("touchstart", wake, { passive: true });
  wake(); // visible briefly on load so it's easy to find

  // Static copy
  document.getElementById("event").innerHTML = "";
  [EVENT.eventLine1, EVENT.eventLine2].forEach((line, i) => {
    if (i) document.getElementById("event").appendChild(document.createElement("br"));
    document.getElementById("event").appendChild(document.createTextNode(line));
  });
  document.getElementById("title").textContent = EVENT.wallTitle;
  if (EVENT.logo) {
    const logo = document.getElementById("logo");
    logo.alt = EVENT.eventLine1;
    logo.onload = () => {
      logo.hidden = false;
      document.getElementById("event").hidden = true; // logo carries the event name
    };
    logo.src = encodeURI(EVENT.logo);
  }
  document.getElementById("prompt").textContent = EVENT.prompt;

  const postUrl = EVENT.postUrl || new URL("./", location.href).href;
  document.getElementById("url").textContent = postUrl.replace(/^https?:\/\//, "").replace(/\/$/, "");
  if (window.QRCode) {
    new QRCode(document.getElementById("qr"), {
      text: postUrl, width: 424, height: 424,
      colorDark: "#181716", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  // Posts
  const grid = document.getElementById("posts");
  const status = document.getElementById("status");
  const db = getFirestore(initializeApp(firebaseConfig));
  const wallQuery = query(collection(db, "wall"), orderBy("approvedAt", "desc"), limit(EVENT.wallCount));

  let known = null; // Set of ids from the previous render; null until first load

  function sizeClass(text) {
    const n = (text || "").length;
    if (n <= 70) return "s1";
    if (n <= 130) return "s2";
    return "s3";
  }

  function byline(post) {
    const by = document.createElement("p");
    by.className = "by";
    const name = (post.name || "").trim();
    const org = (post.org || "").trim();
    if (name) {
      const strong = document.createElement("strong");
      strong.textContent = name;
      by.appendChild(strong);
    }
    if (org) {
      const span = document.createElement("span");
      span.textContent = (name ? ", " : "") + org;
      by.appendChild(span);
    }
    if (!name && !org) {
      const span = document.createElement("span");
      span.textContent = "Expo attendee";
      by.appendChild(span);
    }
    return by;
  }

  function buildCard(post, isLatest, isNew) {
    const card = document.createElement("article");
    const hasPhoto = typeof post.image === "string" && post.image.startsWith("data:image/jpeg;base64,");
    card.className = "card" + (hasPhoto ? " photo" : "") + (isLatest ? " latest" : "") + (isNew ? " enter" : "");

    if (hasPhoto) {
      const img = document.createElement("img");
      img.src = post.image;
      img.alt = "";
      card.appendChild(img);
      const cap = document.createElement("div");
      cap.className = "cap";
      if (post.message) {
        const msg = document.createElement("p");
        msg.className = "msg";
        msg.textContent = post.message;
        cap.appendChild(msg);
      }
      cap.appendChild(byline(post));
      card.appendChild(cap);
      return card;
    }

    const msg = document.createElement("p");
    msg.className = "msg " + sizeClass(post.message);
    msg.textContent = post.message || "";
    card.appendChild(msg);
    card.appendChild(byline(post));
    return card;
  }

  function render(posts) {
    grid.innerHTML = "";
    if (!posts.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      const h = document.createElement("h2");
      h.textContent = "Be the first on the wall.";
      const p = document.createElement("p");
      p.textContent = "Scan the code and share one idea you're taking home.";
      empty.append(h, p);
      grid.appendChild(empty);
      return;
    }
    for (let i = 0; i < EVENT.wallCount; i++) {
      const post = posts[i];
      if (post) {
        const isNew = known !== null && !known.has(post.id);
        grid.appendChild(buildCard(post, i === 0, isNew));
      } else {
        const slot = document.createElement("div");
        slot.className = "slot";
        grid.appendChild(slot);
      }
    }
  }

  function subscribe() {
    onSnapshot(wallQuery, (snap) => {
      status.classList.remove("show");
      const posts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      render(posts);
      known = new Set(posts.map((p) => p.id));
    }, (err) => {
      console.error(err);
      status.classList.add("show");
      setTimeout(subscribe, 5000); // listener stops on error; try again
    });
  }
  subscribe();
</script>
</body>
</html>
