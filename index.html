<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181716">
<title>Post to the Expo Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --base: #181716;
    --edge: #4a4540;
    --card: #ffffff;
    --accent: #d49c61;
    --ink: #181716;
    --steel: #6b645c;
    --line: #ddd8d2;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Barlow, "Segoe UI", system-ui, sans-serif;
    background: var(--card);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-text-size-adjust: 100%;
  }
  header {
    background-color: var(--base);
    background-image:
      linear-gradient(rgba(212,156,97,.13) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,156,97,.13) 1px, transparent 1px);
    background-size: 24px 24px;
    color: #fff;
    padding: calc(22px + env(safe-area-inset-top, 0px)) 22px 24px;
    border-bottom: 6px solid var(--accent);
  }
  .logo { display: block; max-width: 220px; max-height: 72px; width: auto; height: auto; object-fit: contain; margin: 0 0 14px; }
  .event { margin: 0 0 8px; font-size: 15px; line-height: 1.35; color: #b3aca4; }
  h1 {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 44px;
    line-height: .95;
    margin: 0;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 22px calc(32px + env(safe-area-inset-bottom, 0px));
  }
  .prompt { font-size: 23px; font-weight: 600; line-height: 1.25; margin: 0 0 6px; }
  .sub { margin: 0 0 8px; color: var(--steel); font-size: 16px; line-height: 1.4; }
  label { display: block; font-weight: 600; font-size: 16px; margin: 20px 0 6px; }
  .opt { font-weight: 400; color: var(--steel); }
  textarea, input[type="text"] {
    width: 100%;
    font: inherit;
    font-size: 18px;
    padding: 12px 14px;
    border: 2px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    appearance: none;
  }
  textarea { min-height: 150px; resize: vertical; line-height: 1.4; }
  textarea:focus, input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(212,156,97,.3);
  }
  .count { text-align: right; font-size: 14px; color: var(--steel); margin-top: 4px; }
  .count.near { color: var(--danger); font-weight: 600; }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 1fr; gap: 0; }
  button {
    font: inherit;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 24px;
    width: 100%;
    margin-top: 26px;
    padding: 14px 18px;
    border: 0;
    border-radius: 6px;
    background: var(--base);
    color: #fff;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: .6; cursor: default; }
  .error { color: var(--danger); font-weight: 600; margin: 12px 0 0; min-height: 1.3em; }
  .note { font-size: 14px; color: var(--steel); line-height: 1.45; margin: 16px 0 0; }
  .done { display: none; }
  .done.show { display: block; }
  .form.hide { display: none; }
  .done h2 {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-size: 38px;
    line-height: 1;
    margin: 6px 0 12px;
  }
  .done p { font-size: 18px; line-height: 1.45; margin: 0 0 8px; }
  .echo {
    background: #f6f3ef;
    border-left: 6px solid var(--accent);
    border-radius: 6px;
    padding: 14px 16px;
    margin: 18px 0 0;
    font-size: 18px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .photo-pick {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .photo-pick input[type="file"] { position: absolute; left: -10000px; width: 1px; height: 1px; opacity: 0; }
  .pick-btn {
    display: inline-block;
    font-weight: 600;
    font-size: 17px;
    padding: 10px 16px;
    border: 2px solid var(--base);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .photo-pick input[type="file"]:focus-visible + .pick-btn { outline: 3px solid var(--accent); outline-offset: 2px; }
  .photo-status { font-size: 15px; color: var(--steel); }
  .preview { display: none; margin-top: 12px; }
  .preview.show { display: block; }
  .preview img { display: block; max-width: 100%; max-height: 260px; border-radius: 6px; border: 2px solid var(--line); }
  .preview button {
    width: auto; margin-top: 10px; padding: 8px 14px; font-size: 17px;
    font-family: Barlow, "Segoe UI", system-ui, sans-serif; font-weight: 600;
    background: transparent; color: var(--danger); border: 2px solid var(--danger);
  }
  .echo img { display: block; max-width: 100%; max-height: 220px; border-radius: 4px; margin-bottom: 10px; }
  .secondary { background: transparent; color: var(--base); border: 2px solid var(--base); }
</style>
</head>
<body>
<header>
  <img class="logo" id="logo" alt="" hidden>
  <p class="event" id="eventLine"></p>
  <h1 id="wallTitle">The Expo Wall</h1>
</header>

<main>
  <form class="form" id="form" novalidate>
    <p class="prompt" id="prompt"></p>
    <p class="sub">Your post shows up on the big screen once a moderator approves it.</p>

    <label for="message">Your post <span class="opt">(or just a photo)</span></label>
    <textarea id="message" name="message" required></textarea>
    <div class="count" id="count" aria-live="polite"></div>

    <label for="photo">Photo <span class="opt">(optional, JPEG or PNG)</span></label>
    <div class="photo-pick">
      <input type="file" id="photo" accept="image/jpeg,image/png">
      <label for="photo" class="pick-btn" id="pickLabel">Add a photo</label>
      <span class="photo-status" id="photoStatus" aria-live="polite"></span>
    </div>
    <div class="preview" id="preview">
      <img id="previewImg" alt="Your photo">
      <button type="button" id="removePhoto">Remove photo</button>
    </div>

    <label for="name">Name <span class="opt">(optional)</span></label>
    <input type="text" id="name" name="name" maxlength="40" autocomplete="name">

    <label for="org">City, town, or organization <span class="opt">(optional)</span></label>
    <input type="text" id="org" name="org" maxlength="60" autocomplete="organization">

    <div class="hp" aria-hidden="true">
      <label for="website">Leave this empty</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" id="submit">Post to the wall</button>
    <p class="error" id="error" role="alert"></p>
    <p class="note">Keep it clean and on topic. Posts with links or personal attacks won't be approved. Photos are reviewed before they appear.</p>
  </form>

  <section class="done" id="done" aria-live="polite">
    <h2>Posted</h2>
    <p>Watch the screens. Yours will appear once it's approved.</p>
    <div class="echo" id="echo"></div>
    <button type="button" class="secondary" id="again">Post another</button>
  </section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig, EVENT } from "./config.js";

  const db = getFirestore(initializeApp(firebaseConfig));
  const $ = (id) => document.getElementById(id);

  $("eventLine").textContent = `${EVENT.eventLine1}, ${EVENT.eventLine2}`;
  if (EVENT.logo) {
    const logo = $("logo");
    logo.alt = EVENT.eventLine1;
    logo.onload = () => { logo.hidden = false; $("eventLine").textContent = EVENT.eventLine2; };
    logo.src = encodeURI(EVENT.logo);
  }
  $("wallTitle").textContent = EVENT.wallTitle;
  $("prompt").textContent = EVENT.prompt;
  $("message").maxLength = EVENT.maxLength;

  const COOLDOWN_KEY = "expoWallLastPost";

  function updateCount() {
    const left = EVENT.maxLength - $("message").value.length;
    $("count").textContent = `${left} characters left`;
    $("count").classList.toggle("near", left <= 20);
  }
  $("message").addEventListener("input", updateCount);
  updateCount();

  function secondsUntilReady() {
    let last = 0;
    try { last = Number(localStorage.getItem(COOLDOWN_KEY)) || 0; } catch (e) {}
    const wait = EVENT.cooldownSeconds * 1000 - (Date.now() - last);
    return wait > 0 ? Math.ceil(wait / 1000) : 0;
  }

  // ── Photo: resize + re-encode as JPEG on the phone ──────────
  // Re-drawing through a canvas also strips location/camera metadata.
  let photoData = "";

  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
      img.src = url;
    });
  }

  async function compress(file) {
    const img = await loadImage(file);
    let side = EVENT.photoMaxSide;
    let quality = 0.8;
    for (let attempt = 0; attempt < 8; attempt++) {
      const scale = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff"; // flatten PNG transparency
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const data = canvas.toDataURL("image/jpeg", quality);
      if (data.length <= EVENT.photoMaxBytes) return data;
      if (quality > 0.55) quality -= 0.1; else side = Math.round(side * 0.8);
    }
    throw new Error("too-big");
  }

  function clearPhoto() {
    photoData = "";
    $("photo").value = "";
    $("preview").classList.remove("show");
    $("previewImg").removeAttribute("src");
    $("photoStatus").textContent = "";
    $("pickLabel").textContent = "Add a photo";
  }

  $("photo").addEventListener("change", async () => {
    const file = $("photo").files[0];
    $("error").textContent = "";
    if (!file) return;
    if (!["image/jpeg", "image/png"].includes(file.type)) {
      clearPhoto();
      $("error").textContent = "Use a JPEG or PNG photo.";
      return;
    }
    $("photoStatus").textContent = "Preparing photo…";
    $("submit").disabled = true;
    try {
      photoData = await compress(file);
      $("previewImg").src = photoData;
      $("preview").classList.add("show");
      $("photoStatus").textContent = "";
      $("pickLabel").textContent = "Change photo";
    } catch (err) {
      console.error(err);
      clearPhoto();
      $("error").textContent = "That photo couldn't be used. Try a different JPEG or PNG.";
    } finally {
      $("submit").disabled = false;
    }
  });
  $("removePhoto").addEventListener("click", clearPhoto);

  function showDone(message) {
    $("echo").textContent = message;
    if (photoData) {
      const img = document.createElement("img");
      img.src = photoData;
      img.alt = "";
      $("echo").prepend(img);
    }
    $("form").classList.add("hide");
    $("done").classList.add("show");
    window.scrollTo(0, 0);
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("error").textContent = "";

    const message = $("message").value.trim().replace(/\s+\n/g, "\n");
    const name = $("name").value.trim().slice(0, 40);
    const org = $("org").value.trim().slice(0, 60);

    if (!message && !photoData) {
      $("error").textContent = "Write something or add a photo before posting.";
      $("message").focus();
      return;
    }
    if (message.length > EVENT.maxLength) {
      $("error").textContent = `Shorten your post to ${EVENT.maxLength} characters.`;
      return;
    }

    // Honeypot: bots fill hidden fields. Pretend it worked.
    if ($("website").value) { showDone(message); return; }

    const wait = secondsUntilReady();
    if (wait) {
      $("error").textContent = `You can post again in ${wait} seconds.`;
      return;
    }

    $("submit").disabled = true;
    $("submit").textContent = "Posting…";
    try {
      const post = { name, org, message, status: "pending", createdAt: serverTimestamp() };
      if (photoData) post.image = photoData;
      await addDoc(collection(db, "posts"), post);
      try { localStorage.setItem(COOLDOWN_KEY, String(Date.now())); } catch (e2) {}
      showDone(message);
    } catch (err) {
      console.error(err);
      $("error").textContent = "Your post didn't send. Check your connection and try again.";
    } finally {
      $("submit").disabled = false;
      $("submit").textContent = "Post to the wall";
    }
  });

  $("again").addEventListener("click", () => {
    $("message").value = "";
    clearPhoto();
    updateCount();
    $("done").classList.remove("show");
    $("form").classList.remove("hide");
    $("message").focus();
  });
</script>
</body>
</html>
